# GitHub Pages diegimas. Repozitorijos nustatymuose: Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # Jei naudojate savo domeną – BASE_PATH=/ ir VITE_SITE_URL=https://jusu-domenas.lt
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          export BASE_PATH="/${REPO_NAME}/"
          export VITE_SITE_URL="https://${OWNER}.github.io/${REPO_NAME}"
          npm run build
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          VITE_FORM_ENDPOINT: ${{ secrets.VITE_FORM_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
